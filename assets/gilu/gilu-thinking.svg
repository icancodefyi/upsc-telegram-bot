<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="Gilu thinking with a hand on the chin and a question mark" class="gilu gl-thinking">
<style>
.gilu *{transform-box:view-box}
.gilu .tail{transform-origin:240px 340px;animation:gl-sway 3s ease-in-out infinite alternate}
.gilu .eyes{transform-origin:196px 150px;animation:gl-blink 4.5s infinite}
@keyframes gl-sway{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
@keyframes gl-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes gl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes gl-jump{0%,100%{transform:translateY(0)}12%{transform:translateY(4px) scaleY(.97)}40%{transform:translateY(-26px)}62%{transform:translateY(0)}70%{transform:translateY(2px) scaleY(.98)}}
@keyframes gl-shadow{0%,100%,62%{transform:scaleX(1);opacity:1}40%{transform:scaleX(.75);opacity:.6}}
@keyframes gl-twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes gl-floatup{0%{transform:translateY(10px);opacity:0}20%,70%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.gl-thinking .fx1{transform-origin:52px 60px;animation:gl-qbob 1.8s ease-in-out infinite}
.gl-thinking .d1{animation:gl-dot 1.8s ease-in-out infinite}
.gl-thinking .d2{animation:gl-dot 1.8s .3s ease-in-out infinite}
@keyframes gl-qbob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes gl-dot{0%,100%{opacity:.3}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.gilu *{animation:none!important}}
</style>
