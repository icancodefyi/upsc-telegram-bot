<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="Gilu celebrating with both arms up" class="gilu gl-celebrating">
<style>
.gilu *{transform-box:view-box}
.gilu .tail{transform-origin:240px 340px;animation:gl-sway 3s ease-in-out infinite alternate}
.gilu .eyes{transform-origin:196px 150px;animation:gl-blink 4.5s infinite}
@keyframes gl-sway{from{transform:rotate(-3deg)}to{transform:rotate(4deg)}}
@keyframes gl-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
@keyframes gl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes gl-jump{0%,100%{transform:translateY(0)}12%{transform:translateY(4px) scaleY(.97)}40%{transform:translateY(-26px)}62%{transform:translateY(0)}70%{transform:translateY(2px) scaleY(.98)}}
@keyframes gl-shadow{0%,100%,62%{transform:scaleX(1);opacity:1}40%{transform:scaleX(.75);opacity:.6}}
@keyframes gl-twinkle{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1.15);opacity:1}}
@keyframes gl-floatup{0%{transform:translateY(10px);opacity:0}20%,70%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.gl-celebrating .char{transform-origin:200px 410px;animation:gl-jump 1s ease-in-out infinite}
.gl-celebrating .shadow{animation:gl-shadow 1s ease-in-out infinite}
.gl-celebrating .armL{transform-origin:130px 270px;animation:gl-pumpL .5s ease-in-out infinite alternate}
.gl-celebrating .armR{transform-origin:262px 270px;animation:gl-pumpR .5s ease-in-out infinite alternate}
.gl-celebrating .s1{transform-origin:44px 120px;animation:gl-twinkle 1.6s 0s ease-in-out infinite}
.gl-celebrating .s2{transform-origin:356px 120px;animation:gl-twinkle 1.6s 0.4s ease-in-out infinite}
.gl-celebrating .s3{transform-origin:52px 262px;animation:gl-twinkle 1.6s 0.8s ease-in-out infinite}
.gl-celebrating .c1{animation:gl-fall 2s 0s linear infinite}
.gl-celebrating .c2{animation:gl-fall 2.4s .5s linear infinite}
.gl-celebrating .c3{animation:gl-fall 2.2s .9s linear infinite}
.gl-celebrating .c4{animation:gl-fall 2.6s 1.2s linear infinite}
.gl-celebrating .c5{animation:gl-fall 2s 1.5s linear infinite}
@keyframes gl-pumpL{from{transform:rotate(6deg)}to{transform:rotate(-6deg)}}
@keyframes gl-pumpR{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes gl-fall{0%{transform:translate(0,-20px) rotate(0);opacity:0}10%{opacity:1}100%{transform:translate(12px,120px) rotate(200deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.gilu *{animation:none!important}}
</style>
